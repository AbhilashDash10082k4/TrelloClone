services:
  postgres:
    image: postgres:17
    container_name: trello-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: trello
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma

    ports:
      - "5432:5432"

    volumes:
      - trello_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trello"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  trello_postgres_data: